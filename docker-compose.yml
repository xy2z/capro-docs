services:
  web:
    image: nginx:1.23.2
    restart: unless-stopped
    volumes:
      - "./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./public:/app/public"
    networks:
      - web
    environment:
      - VIRTUAL_HOST=capro.xy2z.dev
      - LETSENCRYPT_HOST=capro.xy2z.dev

  builder:
    build: .
    volumes:
      - "./:/app"

networks:
  web:
    external: true
